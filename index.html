#in{animation:up .5s}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.s{font-size:13px;color:var(--ok);font-weight:700;margin-bottom:6px}
h1{font-size:clamp(24px,2.6vw,34px);font-weight:800;margin:0 0 12px;line-height:1.15}
p{font-size:clamp(15px,1.25vw,18px);line-height:1.55;color:var(--mu);margin:8px 0}b{color:var(--tx)}
.k{display:flex;align-items:baseline;gap:10px;margin-top:16px}.k strong{font-size:44px;font-weight:800;color:var(--ok);line-height:1}.k span{font-size:14px;color:var(--mu)}
#chip{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#ffffff1c;vertical-align:middle}
#nv{display:flex;gap:10px;margin-top:22px;align-items:center}#nv button{border:0;border-radius:10px;padding:10px 20px;font:700 15px Mukta,system-ui;background:var(--ok);color:#07060d;cursor:pointer}#nv button#bk{background:#ffffff1f;color:var(--tx)}
#nv span{font-size:12px;color:#8f89a5}
@media (max-width:899px){#ui{top:auto;left:0;width:auto;height:40%;padding:14px 16px;justify-content:flex-start;border-left:0;border-top:1px solid #ffffff1a}h1{font-size:21px;margin-bottom:6px}.k strong{font-size:30px}.k{margin-top:8px}#nv{margin-top:12px}}
@media (prefers-reduced-motion:reduce){#in{animation:none}}
#start{position:fixed;inset:0;z-index:20;background:#07060df2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#start .row{display:flex;gap:14px;margin-top:8px}
#start button{border:0;border-radius:12px;padding:14px 34px;font:700 18px Mukta,system-ui;cursor:pointer;background:var(--ok);color:#07060d}
#start button.alt{background:#ffffff1f;color:var(--tx)}

const brain=new THREE.Group(),bp=[];
for(let i=0;i<3800;i++){const u=Math.random()*2-1,a=Math.random()*6.283,r=Math.sqrt(1-u*u),x=r*Math.cos(a),y=u,z=r*Math.sin(a);

const m=new THREE.Mesh(new THREE.SphereGeometry(.07,10,10),new THREE.MeshBasicMaterial({color:0x5eead4}));m.position.set(r*Math.cos(a)*1.29,u*.88,r*Math.sin(a)*1.08);brain.add(m);els.push(m)}

bands:{type:'bar',title:'EEG band power: task vs rest (n = 36)',cats:['Delta','Theta','Alpha','Beta','Gamma'],xl:'EEG frequency band',yl:'Change in power (%)',y:[-40,30,10],neg:RO,series:[{c:M,v:[11.9,-14.2,-33.9,-12.8,19.4]}],fmt:v=>(v>0?'+':'')+v+'%'},

C.edges.forEach(([a,b],k)=>{const A=P[a],B=P[b],hz=Math.abs(B[0]-A[0])>bw*.6,g=Math.sign(hz?B[0]-A[0]:B[1]-A[1]);

c.strokeStyle='#ffffff44';c.beginPath();c.moveTo(...s);c.lineTo(...e);c.stroke();
c.fillStyle='#ffffff66';c.beginPath();const d=hz?[g*8,0]:[0,g*8],q=hz?[0,5]:[5,0];c.moveTo(...e);c.lineTo(e[0]-d[0]+q[0],e[1]-d[1]+q[1]);c.lineTo(e[0]-d[0]-q[0],e[1]-d[1]-q[1]);c.fill();
c.fillStyle=C.nodes[a][3];for(let j=0;j<3;j++){const t=(T*.4+k*.13+j/3)%1;c.beginPath();c.arc(s[0]+(e[0]-s[0])*t,s[1]+(e[1]-s[1])*t,4,0,7);c.fill()}});

c.fillStyle='#b3accb';c.font=`${fs}px Mukta,system-ui`;C.notes.forEach((t,i)=>c.fillText(t,x+w/2,y+h-18-i*18));c.textBaseline='alphabetic'}
function plot(C,x,y,w,h,p,fs){const c=gx,px=x+66,py=y+56,pw=w-88,ph=h-56-(C.two?84:68),[y0,y1,st]=C.y,Y=v=>py+ph*(1-(v-y0)/(y1-y0)),n=C.cats.length,base=Math.max(y0,Math.min(0,y1));

c.strokeStyle='#f1eefbaa';c.beginPath();c.moveTo(px,py);c.lineTo(px,py+ph);c.lineTo(px+pw,py+ph);c.stroke();
if(y0<0){c.beginPath();c.moveTo(px,Y(0));c.lineTo(px+pw,Y(0));c.stroke()}
c.textAlign='center';C.cats.forEach((t,i)=>t.split('\n').forEach((s,k)=>c.fillText(s,px+pw*(i+.5)/n,py+ph+18+k*(fs+3))));
c.fillStyle=WH;c.font=`700 ${fs}px Mukta,system-ui`;c.fillText(C.xl,px+pw/2,y+h-12);
c.save();c.translate(x+18,py+ph/2);c.rotate(-Math.PI/2);c.fillText(C.yl,0,0);c.restore();
if(C.ref&&C.ref.v>=y0){c.setLineDash([6,5]);c.strokeStyle='#f1eefb99';c.beginPath();c.moveTo(px,Y(C.ref.v));c.lineTo(px+pw,Y(C.ref.v));c.stroke();c.setLineDash([]);c.textAlign='right';c.fillStyle='#f1eefbcc';c.fillText(C.ref.l+' '+C.ref.v+'%',px+pw-4,Y(C.ref.v)-5)}
c.font=`${fs}px Mukta,system-ui`;
if(C.leg){let xr=x+w-16;c.textAlign='right';C.series.slice(0,C.sh||9).reverse().forEach(s=>{c.fillStyle=WH;c.fillText(s.n,xr,y+27);xr-=c.measureText(s.n).width+16;c.fillStyle=s.c;c.fillRect(xr,y+18,10,10);xr-=20})}

C.series.forEach((s,si)=>s.v.forEach((v,i)=>{const e=ease(p*1.6-(i*m+si)*.08),vv=base+(v-base)*e,bx=px+gw*i+gw*.17+bw*si;
c.fillStyle=C.neg&&v<0?C.neg:(s.cc?s.cc[i]:s.c);c.fillRect(bx,Math.min(Y(vv),Y(base)),bw,Math.abs(Y(vv)-Y(base)));

c.fillText(C.fmt(v),bx+bw/2,ty)}}))}
else C.series.slice(0,C.sh).forEach(s=>{const k=p*(n-1)*1.3,X=i=>px+pw*(i+.5)/n;c.strokeStyle=c.fillStyle=s.c;c.lineWidth=3;c.beginPath();c.moveTo(X(0),Y(s.v[0]));

const S=[

vo.addEventListener('error',()=>{vOK=false});
vo.addEventListener('loadedmetadata',()=>{if(auto)seek(START[st])});

let i=0;while(i+1<START.length&&t>=START[i+1])i++;if(i!==st)go(i,true);

addEventListener('keydown',e=>{if(e.key==='d'||e.key==='D'){dbg=!dbg;dEl.style.display=dbg?'block':'none'}});
$('apM').onclick=e=>{e.stopPropagation();setAuto(false)};$('apA').onclick=e=>{e.stopPropagation();setAuto(true)};
function go(n,fa){if(n>=S.length)n=0;if(n<0)n=0;st=n;tp=0;const s=S[n];for(const k in A)A[k].t=s.v[k]||0;
$('in').innerHTML=`<div class="s">Step ${n+1} of ${S.length}</div><h1>${s.t}${s.m?'<span id="chip"></span>':''}</h1>${s.l.map(x=>`<p>${x}</p>`).join('')}${s.k?`<div class="k"><strong>${s.k[0]}</strong><span>${s.k[1]}</span></div>`:''}<div id="nv"><button id="bk">‹ Back</button><button id="nx">Next ›</button><span>Space / click</span></div>`;
[...dots.children].forEach((d,i)=>d.className=i<=n?'on':'');chip();if(auto&&!fa)seek(START[n])}

function chip(){const c=$('chip');if(c){c.textContent=mode?'doing math':'resting';c.style.color=mode?RO:M}}
addEventListener('click',e=>{if(e.target.closest('#ap'))return;if(e.target.id==='bk')go(st-1);else go(st+1)});
addEventListener('keydown',e=>{if($('start'))return;if(e.code==='Space'||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();go(st+1)}else if(e.key==='ArrowLeft'||e.key==='Backspace')go(st-1)});
let T=0,wf=4,wa=.2,hr=1.2,last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;mt+=dt;sync(dt);
if(mt>3.6){mt=0;mode^=1;chip()}
wf+=((mode?9:4)-wf)*.05;wa+=((mode?.07:.2)-wa)*.05;hr+=((mode?1.6:1.2)-hr)*.03;
for(const k in A){const a=A[k];a.o+=(a.t-a.o)*.07;a.l.forEach(o=>{o.visible=a.o>.01;o.traverse(n=>{if(n.material)n.material.opacity=a.o*(n.material.userData.b??1)})})}
brain.rotation.y=T*.25;heart.rotation.y=Math.sin(T*.5)*.6;els.forEach((m,i)=>m.scale.setScalar(1+.5*Math.sin(T*(mode?7:3)+i)));
hpts.scale.setScalar(.06*(1+.1*Math.pow(Math.max(0,Math.sin(T*hr*6.283)),6)));
const p=eg.geometry.attributes.position,q=cg.geometry.attributes.position;
for(let i=0;i<140;i++){const u=i/139,x=-1.6+3.2*u,e=Math.sin(Math.PI*u);
p.setXYZ(i,x,wa*e*(Math.sin(x*wf*2+T*(mode?9:4))+.4*Math.sin(x*wf*3.7-T*6)),0);
const ph=(((x*.9-T*hr*.5)%1)+1)%1;q.setXYZ(i,x,e*(.55*Math.exp(-Math.pow((ph-.5)*22,2))-.12*Math.exp(-Math.pow((ph-.42)*30,2))+.1*Math.exp(-Math.pow((ph-.72)*14,2))),0)}
p.needsUpdate=q.needsUpdate=true;
const lp=lk.geometry.attributes.position;for(let i=0;i<160;i++){const pt=cvs[i%2].getPoint(((i>>1)/80+T*.25*(mode?1.5:1))%1);lp.setXYZ(i,pt.x,pt.y,pt.z)}lp.needsUpdate=true;
c36.rotation.z=T*.15;c65.rotation.z=-T*.1;
const s=S[st],a=Math.sin(T*.2)*.5;cur.y+=(s.cam[0]-cur.y)*.05;cur.z+=(s.cam[1]-cur.z)*.05;
sa+=((dsk&&s.ch&&!s.ch.wide?1:0)-sa)*.06;cam.setViewOffset(sw,sh,sw*.24*sa,0,sw,sh);cam.updateProjectionMatrix();
cam.position.set(Math.sin(a)*cur.z,cur.y,Math.cos(a)*cur.z);cam.lookAt(0,cur.y,0);R.render(sc,cam);
gx.clearRect(0,0,sw,sh);tp=Math.min(1.7,tp+dt/2.6);
if(s.ch){const r=dsk?(s.ch.wide?[.04,.12,.92,.7]:[.46,.07,.52,.84]):[.03,.05,.94,.9];draw(s.ch,sw*r[0],sh*r[1],sw*r[2],sh*r[3],tp,T)}}
function begin(a){$('start').remove();setAuto(a);go(0)}$('start').onclick=e=>e.stopPropagation();
$('sM').onclick=e=>{e.stopPropagation();begin(false)};$('sA').onclick=e=>{e.stopPropagation();begin(true)};
go(0);requestAnimationFrame(frame);
</script></body></html>
